[project]
name = "demand-lakehouse"
version = "0.1.0"
description = "Demand forecasting for thousands of series on a local Spark + Delta Lake lakehouse, with data-quality gates and backtests"
readme = "README.md"
authors = [
    { name = "Shivam Tiwari" }
]
requires-python = ">=3.12"
dependencies = [
    "delta-spark==4.4.1",
    "pyspark==4.2.0",
    "pyarrow>=20",
    "pandas>=2.2,<3",
    "pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
