# Lint, tests (the pipeline on a hand-made fixture with the real files' problems) and the eval gate. The gate replays
# the backtest on Spark from the committed gold snapshot (data/gold/zone_day.parquet), so it needs no 800 MB download;
# it fails if the numbers no longer reproduce results/backtest.json or the model stops beating seasonal-naive.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v6
      - name: Cache Delta jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-delta-4.4.1
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Eval gate (backtest replay)
        run: uv run python -m demand_lakehouse ci
